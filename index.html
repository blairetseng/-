<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紫微斗數課｜銷售儀表板</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f4;--bg3:#efefed;--bgi:#e6f1fb;
  --t1:#1a1a18;--t2:#5f5e5a;--t3:#888780;--ti:#185fa5;
  --b1:rgba(0,0,0,0.35);--b2:rgba(0,0,0,0.22);--b3:rgba(0,0,0,0.12);
  --r1:8px;--r2:12px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#2a2a28;--bg3:#323230;--bgi:#042c53;
  --t1:#f0ede8;--t2:#b4b2a9;--t3:#888780;--ti:#85b7eb;
  --b1:rgba(255,255,255,0.35);--b2:rgba(255,255,255,0.22);--b3:rgba(255,255,255,0.12);
}}
body{font-family:var(--font);background:var(--bg3);color:var(--t1);min-height:100vh;padding:16px}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:18px;font-weight:500;margin-bottom:16px}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:16px}
.metric{background:var(--bg2);border-radius:var(--r1);padding:12px 14px}
.metric-label{font-size:12px;color:var(--t2);margin-bottom:4px}
.metric-value{font-size:20px;font-weight:500;color:var(--t1)}
.metric-sub{font-size:11px;color:var(--t3);margin-top:2px}
.metric.profit .metric-value{color:#1D9E75}.metric.loss .metric-value{color:#E24B4A}
.card{background:var(--bg);border:0.5px solid var(--b3);border-radius:var(--r2);padding:14px 16px;margin-bottom:12px}
.upload-zone{border:1px dashed var(--b2);border-radius:var(--r2);padding:20px;text-align:center;cursor:pointer;transition:background 0.15s;margin-bottom:12px;background:var(--bg)}
.upload-zone:hover{background:var(--bg2)}
.upload-zone input[type=file]{display:none}
.file-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.chip{font-size:12px;background:var(--bgi);color:var(--ti);padding:3px 10px;border-radius:20px;display:flex;align-items:center;gap:4px}
.chip button{background:none;border:none;cursor:pointer;color:var(--ti);font-size:14px;line-height:1;padding:0}
.sl{font-size:13px;font-weight:500;color:var(--t2);margin-bottom:10px}
.prog-wrap{background:var(--bg2);border-radius:20px;height:10px;overflow:hidden;margin:6px 0 2px}
.prog-bar{height:100%;border-radius:20px;background:#378ADD;transition:width 0.4s ease}.prog-bar.over{background:#1D9E75}
.empty{text-align:center;padding:40px 20px;color:var(--t3);font-size:14px;background:var(--bg);border-radius:var(--r2);border:0.5px solid var(--b3)}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:0.5px solid var(--b3)}
.tab{font-size:13px;padding:6px 12px;cursor:pointer;color:var(--t2);border-bottom:2px solid transparent;margin-bottom:-0.5px;background:none;border-left:none;border-right:none;border-top:none}
.tab.active{color:var(--t1);border-bottom-color:var(--t1);font-weight:500}
.day-sel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.day-btn{font-size:12px;padding:4px 10px;border-radius:20px;border:0.5px solid var(--b2);background:none;cursor:pointer;color:var(--t2)}
.day-btn.active{background:var(--t1);color:var(--bg);border-color:var(--t1)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-weight:500;color:var(--t2);text-align:left;padding:6px 8px;border-bottom:0.5px solid var(--b3);white-space:nowrap}
td{padding:6px 8px;border-bottom:0.5px solid var(--b3);color:var(--t1);white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td.ic{padding:3px 6px}
tr:last-child td{border-bottom:none}
.ok{color:#1D9E75;font-weight:500}.warn{color:#BA7517;font-weight:500}.bad{color:#E24B4A;font-weight:500}
.ni{font-size:12px;text-align:right;background:var(--bg2);border:0.5px solid var(--b2);border-radius:4px;padding:3px 6px;color:var(--t1)}
.ni:focus{outline:none;border-color:var(--b1)}
.ai{width:100px}.fi{width:110px}
.sum-card{background:var(--bg2);border-radius:var(--r2);padding:14px 16px;margin-bottom:12px;border-left:3px solid #378ADD}
.sum-title{font-size:12px;font-weight:500;color:var(--t2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sum-body{font-size:13px;color:var(--t1);line-height:1.9}
.sum-body .hi{color:#1D9E75;font-weight:500}.sum-body .lo{color:#E24B4A;font-weight:500}.sum-body .mid{color:#BA7517;font-weight:500}
.cost-sec{background:var(--bg);border:0.5px solid var(--b3);border-radius:var(--r2);padding:14px 16px;margin-bottom:12px}
.fct{width:100%;font-size:12px;margin-top:10px;border-collapse:collapse}
.fct td{padding:5px 6px;border-bottom:0.5px solid var(--b3);color:var(--t1)}
.fct tr:last-child td{border-bottom:none;font-weight:500}
.fct .lb{color:var(--t2)}
.qa-box{background:var(--bg2);border-radius:var(--r1);padding:12px 14px;margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qa-box label{font-size:12px;color:var(--t2);white-space:nowrap}
.qa-box select{font-size:12px;padding:4px 8px;border-radius:4px;border:0.5px solid var(--b2);background:var(--bg);color:var(--t1);cursor:pointer}
.btn{font-size:12px;padding:4px 12px;border-radius:4px;border:none;cursor:pointer;white-space:nowrap}
.btn-blue{background:#378ADD;color:#fff}.btn-blue:hover{opacity:0.85}
.btn-green{background:#1D9E75;color:#fff}
.btn-gray{background:var(--bg2);color:var(--t2);border:0.5px solid var(--b2)}
.cmg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.sync{font-size:11px;color:var(--t3);margin-top:8px;display:flex;align-items:center;gap:4px}
.dot{width:6px;height:6px;border-radius:50%;background:#1D9E75;display:inline-block;flex-shrink:0}
.dot.spin{background:#BA7517;animation:pulse 1s infinite}.dot.err{background:#E24B4A}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.gdrive-sec{background:var(--bg);border:0.5px solid var(--b3);border-radius:var(--r2);padding:14px 16px;margin-bottom:12px}
.gdrive-browser{margin-top:12px}
.gdrive-breadcrumb{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--t2);margin-bottom:8px;flex-wrap:wrap}
.gdrive-breadcrumb span{cursor:pointer;color:var(--ti)}.gdrive-breadcrumb span:hover{text-decoration:underline}
.gdrive-breadcrumb .sep{color:var(--t3);cursor:default}
.gdrive-list{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto}
.gdrive-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bg2);border-radius:var(--r1);font-size:13px;cursor:pointer;transition:background 0.1s}
.gdrive-item:hover{background:var(--bg3)}
.gdrive-item-name{color:var(--t1);flex:1;display:flex;align-items:center;gap:6px}
.gdrive-item-date{color:var(--t3);font-size:11px;margin:0 10px;white-space:nowrap}
.gdrive-item-btn{font-size:11px;padding:3px 10px;border-radius:4px;border:none;background:#378ADD;color:#fff;cursor:pointer;white-space:nowrap}
.gdrive-item-btn:disabled{background:var(--bg3);color:var(--t3);cursor:default}
.gdrive-item-btn.loaded{background:#1D9E75}
</style>
</head>
<body>
<div class="wrap">
<h1><i class="ti ti-chart-bar" style="margin-right:6px;vertical-align:-2px"></i>紫微斗數課｜銷售儀表板</h1>

<div class="gdrive-sec">
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
    <div>
      <div class="sl" style="margin-bottom:2px">☁️ Google 雲端報表</div>
      <p style="font-size:12px;color:var(--t3)">瀏覽資料夾，直接載入報表</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="gdriveStatus" style="font-size:12px;color:var(--t3)">尚未連結</span>
      <button class="btn btn-blue" id="gdriveConnectBtn" onclick="gdriveConnect()">連結 Google 雲端</button>
    </div>
  </div>
  <div class="gdrive-browser" id="gdriveBrowser" style="display:none">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <div class="gdrive-breadcrumb" id="gdriveBreadcrumb"></div>
      <button class="btn btn-gray" onclick="gdriveRefresh()" style="font-size:11px;padding:3px 8px;flex-shrink:0">重新整理</button>
    </div>
    <div class="gdrive-list" id="gdriveList"><div style="font-size:12px;color:var(--t3);padding:8px">載入中...</div></div>
  </div>
</div>

<div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
  <i class="ti ti-upload" style="font-size:22px;color:var(--t3)"></i>
  <p style="font-size:14px;color:var(--t2);margin-top:6px"><strong style="color:var(--t1)">或手動上傳</strong> Excel 報表（可多選）</p>
  <p style="font-size:12px;color:var(--t3);margin-top:3px">支援 .xlsx 格式</p>
  <div class="file-list" id="fileList"></div>
  <input type="file" id="fileInput" accept=".xlsx,.xls" multiple>
</div>

<div id="dashContent">
  <div class="empty"><i class="ti ti-chart-bar" style="font-size:32px;display:block;margin-bottom:8px"></i>從 Google 雲端載入或手動上傳報表後，圖表將自動出現</div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
Chart.register(ChartDataLabels);

const GOOGLE_CLIENT_ID='849110261675-hbgs9b7r9dl2gm2qrm5mmu8j1qc2fc2m.apps.googleusercontent.com';
const SB_URL='https://jbidtnredgrzrrxruxrd.supabase.co';
const SB_KEY='sb_publishable_KjdR6XvT0VXRkgYFywWn4g_mxeGbaae';
const DAILY_TARGET=1041667,TOTAL_TARGET=50000000;
const CAMPAIGN_START=new Date('2026-06-09'),CAMPAIGN_END=new Date('2026-07-26');
const fixedCostItems=[
  {id:'prep',label:'前置準備',value:1200000},
  {id:'pread',label:'前測廣告',value:800000},
  {id:'kol',label:'KOL 費用',value:2000000}
];
const DISCOUNT_MAP=[
  {key:'舊生0元',match:r=>r.discountName&&r.discountName.includes('舊生兌換碼')},
  {key:'原價',match:r=>!r.discountName||r.discountName.trim()===''},
  {key:'桃桃喜500',match:r=>r.discountName&&r.discountName.includes('桃桃喜老朋友專屬折扣碼')},
  {key:'omember500',match:r=>r.discountName&&(r.discountName.includes('omember500')||r.discountName.includes('老朋友領取折扣碼'))},
  {key:'YTM500',match:r=>r.discountName&&r.discountName.includes('YTM500')},
  {key:'HOLO500',match:r=>r.discountName&&r.discountName.includes('HOLO500')},
  {key:'SAT500',match:r=>r.discountName&&r.discountName.includes('SAT500')},
  {key:'問券400',match:r=>r.discountName&&(r.discountName.includes('問券填寫')||r.discountName.includes('填寫問券'))},
  {key:'youngyt350',match:r=>r.discountName&&(r.discountName.includes('youngyt350')||r.discountName.includes('young350'))},
  {key:'ttx350',match:r=>r.discountName&&r.discountName.includes('ttx350')},
  {key:'doligu888350',match:r=>r.discountName&&r.discountName.includes('doligu888350')},
  {key:'TANG350',match:r=>r.discountName&&r.discountName.includes('TANG350')},
  {key:'TU400',match:r=>r.discountName&&r.discountName.includes('TU400')},
  {key:'其他',match:r=>true},
];

let allOrders=[],uploadedFiles=[],adCosts={},gToken=null;
let folderStack=[{id:'root',name:'我的雲端硬碟'}];
const charts={};
let selDiscountDay='all',selHourDay='all';

// ── Supabase ──
async function sbSet(key,value){try{await fetch(`${SB_URL}/rest/v1/costs`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify({key,value:Number(value)})});}catch(e){}}
async function loadAllCosts(){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/costs?select=key,value`,{headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}});
    const d=await r.json();if(!Array.isArray(d))return;
    d.forEach(row=>{
      if(row.key.startsWith('ad_'))adCosts[row.key.replace('ad_','')]=Number(row.value);
      else if(row.key.startsWith('fixed_')){const item=fixedCostItems.find(i=>i.id===row.key.replace('fixed_',''));if(item)item.value=Number(row.value);}
    });
    setSyncStatus('ok');
  }catch(e){setSyncStatus('error');}
}
function setSyncStatus(s,msg){
  const el=document.getElementById('syncStatus');if(!el)return;
  const dot=el.querySelector('.dot'),txt=el.querySelector('.stxt');
  if(s==='ok'){dot.className='dot';txt.textContent='成本資料已同步雲端';}
  else if(s==='loading'){dot.className='dot spin';txt.textContent='同步中...';}
  else if(s==='error'){dot.className='dot err';txt.textContent='雲端連線失敗';}
  else if(s==='saved'){dot.className='dot';txt.textContent=msg||'已儲存';}
}

// ── Google Drive ──
function gdriveConnect(){
  const client=google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID,
    scope:'https://www.googleapis.com/auth/drive.readonly',
    callback:(resp)=>{
      if(resp.error)return;
      gToken=resp.access_token;
      document.getElementById('gdriveStatus').textContent='已連結 ✓';
      document.getElementById('gdriveStatus').style.color='#1D9E75';
      document.getElementById('gdriveConnectBtn').textContent='重新連結';
      document.getElementById('gdriveBrowser').style.display='block';
      folderStack=[{id:'root',name:'我的雲端硬碟'}];
      renderBreadcrumb();
      loadFolder('root');
    }
  });
  client.requestAccessToken();
}

function renderBreadcrumb(){
  const el=document.getElementById('gdriveBreadcrumb');
  el.innerHTML=folderStack.map((f,i)=>{
    if(i===folderStack.length-1)return`<span style="color:var(--t1);cursor:default;font-weight:500">${f.name}</span>`;
    return`<span onclick="gotoFolder(${i})">${f.name}</span><span class="sep">/</span>`;
  }).join('');
}

function gotoFolder(idx){
  folderStack=folderStack.slice(0,idx+1);
  renderBreadcrumb();
  loadFolder(folderStack[folderStack.length-1].id);
}

async function loadFolder(folderId){
  const listEl=document.getElementById('gdriveList');
  listEl.innerHTML='<div style="font-size:12px;color:var(--t3);padding:8px">載入中...</div>';
  try{
    const q=folderId==='root'
      ?`'root' in parents and trashed=false`
      :`'${folderId}' in parents and trashed=false`;
    const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&orderBy=folder,name&fields=files(id,name,mimeType,modifiedTime)&pageSize=50`,{headers:{'Authorization':`Bearer ${gToken}`}});
    const d=await r.json();
    if(!d.files||d.files.length===0){listEl.innerHTML='<div style="font-size:12px;color:var(--t3);padding:8px">此資料夾沒有檔案</div>';return;}
    listEl.innerHTML='';
    d.files.forEach(f=>{
      const isFolder=f.mimeType==='application/vnd.google-apps.folder';
      const isXlsx=f.mimeType==='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'||f.name.endsWith('.xlsx')||f.name.endsWith('.xls');
      if(!isFolder&&!isXlsx)return;
      const isLoaded=uploadedFiles.includes(f.id);
      const date=new Date(f.modifiedTime).toLocaleDateString('zh-TW');
      const div=document.createElement('div');div.className='gdrive-item';
      if(isFolder){
        div.innerHTML=`<span class="gdrive-item-name"><i class="ti ti-folder" style="color:#378ADD"></i>${f.name}</span><span class="gdrive-item-date">${date}</span><span style="font-size:11px;color:var(--t3)">開啟 →</span>`;
        div.onclick=()=>{folderStack.push({id:f.id,name:f.name});renderBreadcrumb();loadFolder(f.id);};
      }else{
        div.innerHTML=`<span class="gdrive-item-name"><i class="ti ti-file-spreadsheet" style="color:#1D9E75"></i>${f.name}</span><span class="gdrive-item-date">${date}</span><button class="gdrive-item-btn ${isLoaded?'loaded':''}" ${isLoaded?'disabled':''} onclick="event.stopPropagation();gdriveLoadFile('${f.id}','${f.name}',this)">${isLoaded?'已載入':'載入'}</button>`;
      }
      listEl.appendChild(div);
    });
    if(listEl.children.length===0)listEl.innerHTML='<div style="font-size:12px;color:var(--t3);padding:8px">此資料夾沒有 Excel 檔案或子資料夾</div>';
  }catch(e){listEl.innerHTML='<div style="font-size:12px;color:#E24B4A;padding:8px">載入失敗，請重新連結</div>';}
}

function gdriveRefresh(){
  if(!gToken)return;
  loadFolder(folderStack[folderStack.length-1].id);
}

async function gdriveLoadFile(fileId,fileName,btn){
  btn.textContent='載入中...';btn.disabled=true;
  try{
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,{headers:{'Authorization':`Bearer ${gToken}`}});
    const buf=await r.arrayBuffer();
    const orders=parseXlsx(new Uint8Array(buf));
    mergeOrders(orders);uploadedFiles.push(fileId);
    btn.textContent='已載入';btn.className='gdrive-item-btn loaded';
    const chip=document.createElement('div');chip.className='chip';
    chip.innerHTML=`<i class="ti ti-brand-google-drive"></i>${fileName} <button onclick="removeAllFiles()">×</button>`;
    document.getElementById('fileList').appendChild(chip);
    renderDash();
  }catch(e){btn.textContent='載入失敗';btn.disabled=false;}
}

// ── 資料處理 ──
function classifyDiscount(r){for(const d of DISCOUNT_MAP)if(d.match(r))return d.key;return'其他';}
function parseXlsx(buffer){
  const wb=XLSX.read(buffer,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1});const headers=rows[0];if(!headers)return[];
  const idx=n=>headers.findIndex(h=>h&&String(h).includes(n));
  const iO=idx('訂單編號'),iS=idx('訂單狀態'),iP=idx('付款方式'),iC=idx('訂單建立時間'),iD=idx('折扣名稱'),iT=idx('訂單總額');
  const orders=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];if(!r[iO]||r[iS]!=='SUCCESS')continue;
    const cs=String(r[iC]||'');const dm=cs.match(/(\d{4})\/(\d{2})\/(\d{2})/);if(!dm)continue;
    const hm=cs.match(/(\d{2}):\d{2}/);
    orders.push({id:String(r[iO]),date:`${dm[1]}-${dm[2]}-${dm[3]}`,hour:hm?parseInt(hm[1]):0,total:parseInt(r[iT])||0,discountName:String(r[iD]||''),payMethod:String(r[iP]||'').split(/\s+/)[0].trim()});
  }
  orders.forEach(o=>{o.discountKey=classifyDiscount(o);});return orders;
}
function mergeOrders(n){const ids=new Set(allOrders.map(o=>o.id));allOrders=allOrders.concat(n.filter(o=>!ids.has(o.id)));}
function destroyChart(k){if(charts[k]){charts[k].destroy();charts[k]=null;}}
function getByDate(){const d={};allOrders.forEach(o=>{if(!d[o.date])d[o.date]={rev:0,cnt:0};d[o.date].rev+=o.total;d[o.date].cnt++;});return d;}
function getTotalFixedCost(){return fixedCostItems.reduce((s,i)=>s+i.value,0);}
function getTotalAdCost(){return Object.values(adCosts).reduce((s,v)=>s+v,0);}
function getTotalCost(){return getTotalFixedCost()+getTotalAdCost();}

function buildSummary(sd,bd,tr){
  if(!sd.length)return'';
  const ld=sd[sd.length-1],today=bd[ld];
  const tc=getTotalCost(),ac=getTotalAdCost(),gp=tr-tc,roi=tc>0?((tr/tc-1)*100):null;
  const now=new Date(),dp=Math.max(1,Math.floor((now-CAMPAIGN_START)/86400000)+1);
  const dl=Math.max(0,Math.floor((CAMPAIGN_END-now)/86400000));
  const ct=Math.min(dp*DAILY_TARGET,TOTAL_TARGET),cp=(tr/ct*100);
  const dn=dl>0?(Math.max(0,TOTAL_TARGET-tr)/dl):0;
  const ds=today.rev>=DAILY_TARGET?`<span class="hi">超標 $${((today.rev-DAILY_TARGET)/10000).toFixed(1)}萬</span>`:`<span class="lo">未達標，缺口 $${((DAILY_TARGET-today.rev)/10000).toFixed(1)}萬</span>`;
  const byD={};allOrders.filter(o=>o.date===ld).forEach(o=>{byD[o.discountKey]=(byD[o.discountKey]||0)+1;});
  const top=Object.entries(byD).sort((a,b)=>b[1]-a[1])[0];
  const byH=Array(24).fill(0);allOrders.filter(o=>o.date===ld).forEach(o=>{byH[o.hour]++;});
  const peak=byH.indexOf(Math.max(...byH));
  const ps=cp>=110?`<span class="hi">大幅超前（${cp.toFixed(0)}%）</span>`:cp>=100?`<span class="hi">符合進度（${cp.toFixed(0)}%）</span>`:cp>=85?`<span class="mid">略微落後（${cp.toFixed(0)}%）</span>`:`<span class="lo">明顯落後（${cp.toFixed(0)}%）</span>`;
  const prs=gp>=0?`<span class="hi">+$${(gp/10000).toFixed(1)}萬</span>`:`<span class="lo">-$${(Math.abs(gp)/10000).toFixed(1)}萬（尚未回本）</span>`;
  const rs=roi!==null?(roi>=0?`<span class="hi">ROI ${roi.toFixed(0)}%</span>`:`<span class="lo">ROI ${roi.toFixed(0)}%</span>`):'尚無成本資料';
  return`<div class="sum-body">📅 <strong>${ld} 日報</strong><br>當日營收 <strong>$${(today.rev/10000).toFixed(1)}萬</strong>（${today.cnt} 筆），${ds}，購買高峰 <strong>${peak}:00–${peak+1}:00</strong>。${top?` 最活躍渠道 <strong>${top[0]}</strong>（${top[1]} 筆）。`:''}<br><br>📊 <strong>累積進度</strong> ${ps}，累積 $${(tr/10000).toFixed(1)}萬。${dl>0?` 剩餘 ${dl} 天每日需達 <strong class="${dn>DAILY_TARGET*1.3?'lo':dn>DAILY_TARGET?'mid':'hi'}">$${(dn/10000).toFixed(1)}萬</strong>。`:'活動已結束。'}<br><br>💰 <strong>損益</strong> 累積毛利 ${prs}，${rs}（固定 $${(getTotalFixedCost()/10000).toFixed(1)}萬 + 廣告 $${(ac/10000).toFixed(1)}萬）。${ac===0?' <span class="mid">⚠ 尚未填入廣告成本，損益僅供參考。</span>':''}</div>`;
}

function getDiscountData(day){const f=day==='all'?allOrders:allOrders.filter(o=>o.date===day);const d={};f.forEach(o=>{if(!d[o.discountKey])d[o.discountKey]={cnt:0,rev:0};d[o.discountKey].cnt++;d[o.discountKey].rev+=o.total;});return d;}
function renderDiscountChart(){destroyChart('discount');const ctx=document.getElementById('discountChart');if(!ctx)return;const d=getDiscountData(selDiscountDay),keys=Object.keys(d).sort((a,b)=>d[b].cnt-d[a].cnt);charts.discount=new Chart(ctx,{type:'bar',data:{labels:keys,datasets:[{label:'使用人數',data:keys.map(k=>d[k].cnt),backgroundColor:'#1D9E75',borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},datalabels:{anchor:'end',align:'end',color:'#5f5e5a',font:{size:11},formatter:v=>v+' 人'}},scales:{x:{ticks:{font:{size:11}},grid:{color:'rgba(128,128,128,0.08)'}},y:{ticks:{font:{size:11},autoSkip:false},grid:{display:false}}},layout:{padding:{right:55}}}});}
function renderHourChart(){destroyChart('hour');const ctx=document.getElementById('hourChart');if(!ctx)return;const f=selHourDay==='all'?allOrders:allOrders.filter(o=>o.date===selHourDay);const bH=Array(24).fill(0);f.forEach(o=>{bH[o.hour]++;});charts.hour=new Chart(ctx,{type:'bar',data:{labels:Array.from({length:24},(_,i)=>i+':00'),datasets:[{label:'購買數',data:bH,backgroundColor:'rgba(127,119,221,0.75)',borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},datalabels:{anchor:'end',align:'end',color:'#5f5e5a',font:{size:10},formatter:v=>v>0?v:''}},scales:{x:{ticks:{font:{size:10},autoSkip:false,maxRotation:0},grid:{color:'rgba(128,128,128,0.08)'}},y:{ticks:{font:{size:11}},grid:{color:'rgba(128,128,128,0.08)'},beginAtZero:true}},layout:{padding:{top:16}}}});}
function daySel(ip,sel,dates){return`<div class="day-sel" id="${ip}Wrap"><span style="font-size:12px;color:var(--t2)">查看：</span><button class="day-btn ${sel==='all'?'active':''}" onclick="selDay('${ip}','all',this)">全部加總</button>${dates.map(d=>`<button class="day-btn ${sel===d?'active':''}" onclick="selDay('${ip}','${d}',this)">${d.slice(5)}</button>`).join('')}</div>`;}
function selDay(type,day,btn){document.querySelectorAll(`#${type}Wrap .day-btn`).forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(type==='discountDay'){selDiscountDay=day;renderDiscountChart();}if(type==='hourDay'){selHourDay=day;renderHourChart();}}
function updateAllCostDisplays(){
  const tr=allOrders.reduce((s,o)=>s+o.total,0);
  const fc=getTotalFixedCost(),ac=getTotalAdCost(),tc=getTotalCost(),gp=tr-tc,roi=tc>0?((tr/tc-1)*100):null;
  const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val;};
  set('mFC','$'+(fc/10000).toFixed(1)+'萬');set('mAC','$'+(ac/10000).toFixed(1)+'萬');set('mTC','$'+(tc/10000).toFixed(1)+'萬');
  set('mP',(gp>=0?'+':'-')+'$'+(Math.abs(gp)/10000).toFixed(1)+'萬');set('mR',roi!==null?'ROI '+roi.toFixed(0)+'%':'—');
  const pe=document.getElementById('mP');if(pe)pe.closest('.metric').className='metric '+(gp>=0?'profit':'loss');
  const ft=document.getElementById('fct');if(ft)ft.textContent='$'+(fc/10000).toFixed(1)+'萬';
  updateSummary();
}
function updateSummary(){const bd=getByDate(),sd=Object.keys(bd).sort(),tr=allOrders.reduce((s,o)=>s+o.total,0);const el=document.getElementById('sumBody');if(el)el.innerHTML=buildSummary(sd,bd,tr);}
async function updateFixedCostItem(id,input){const val=parseInt(input.value)||0;const item=fixedCostItems.find(i=>i.id===id);if(item)item.value=val;updateAllCostDisplays();setSyncStatus('loading');await sbSet('fixed_'+id,val);setSyncStatus('saved','固定成本已儲存');}
function refreshDetailRow(date){const row=document.querySelector(`tr[data-date="${date}"]`);if(!row)return;const cells=row.querySelectorAll('td'),rev=parseInt(row.dataset.rev)||0,av=adCosts[date]||0,dp=rev-av;const inp=row.querySelector('.ai');if(inp)inp.value=av||'';cells[6].textContent=(dp>=0?'+':'-')+'$'+(Math.abs(dp)/10000).toFixed(1)+'萬';cells[6].className='n '+(dp>=0?'ok':'bad');}
async function updateAdCost(input){const date=input.dataset.date;adCosts[date]=parseInt(input.value)||0;const qi=document.getElementById('qai'),qd=document.getElementById('qad');if(qi&&qd&&qd.value===date)qi.value=adCosts[date]||'';refreshDetailRow(date);updateAllCostDisplays();setSyncStatus('loading');await sbSet('ad_'+date,adCosts[date]);setSyncStatus('saved','廣告成本已儲存');}
async function applyQuickAd(){const date=document.getElementById('qad').value,val=parseInt(document.getElementById('qai').value)||0;if(!date){alert('請先選擇日期');return;}adCosts[date]=val;refreshDetailRow(date);updateAllCostDisplays();const btn=document.getElementById('qab');btn.textContent='儲存中...';btn.style.background='#BA7517';setSyncStatus('loading');await sbSet('ad_'+date,val);btn.textContent='已儲存 ✓';btn.style.background='#1D9E75';setSyncStatus('saved','廣告成本已儲存');setTimeout(()=>{btn.textContent='套用';btn.style.background='#378ADD';},1500);}

function renderDash(){
  if(allOrders.length===0){document.getElementById('dashContent').innerHTML=`<div class="empty"><i class="ti ti-chart-bar" style="font-size:32px;display:block;margin-bottom:8px"></i>從 Google 雲端載入或手動上傳報表後，圖表將自動出現</div>`;return;}
  const now=new Date(),dp=Math.max(1,Math.floor((now-CAMPAIGN_START)/86400000)+1),dt=Math.floor((CAMPAIGN_END-CAMPAIGN_START)/86400000)+1;
  const tr=allOrders.reduce((s,o)=>s+o.total,0),to=allOrders.filter(o=>o.total>0).length;
  const ct=Math.min(dp*DAILY_TARGET,TOTAL_TARGET),pct=(tr/TOTAL_TARGET*100).toFixed(1),cpt=(tr/ct*100).toFixed(1);
  const fc=getTotalFixedCost(),ac=getTotalAdCost(),tc=getTotalCost(),gp=tr-tc,roi=tc>0?((tr/tc-1)*100):null;
  const bd=getByDate(),sd=Object.keys(bd).sort();
  const byPay={};allOrders.forEach(o=>{if(!o.payMethod)return;byPay[o.payMethod]=(byPay[o.payMethod]||0)+1;});
  const dKeys=Object.keys(getDiscountData('all')),dH=Math.max(260,dKeys.length*38+80);
  const ld=sd[sd.length-1]||'';
  document.getElementById('dashContent').innerHTML=`
    <div class="metric-grid">
      <div class="metric"><div class="metric-label">累計營收</div><div class="metric-value">$${(tr/10000).toFixed(1)}萬</div><div class="metric-sub">目標 $${(TOTAL_TARGET/10000).toFixed(0)}萬</div></div>
      <div class="metric"><div class="metric-label">總目標達成率</div><div class="metric-value">${pct}%</div><div class="metric-sub">總目標 5,000萬</div></div>
      <div class="metric"><div class="metric-label">當期達成率</div><div class="metric-value ${parseFloat(cpt)>=100?'ok':'warn'}">${cpt}%</div><div class="metric-sub">應走進度 $${(ct/10000).toFixed(1)}萬</div></div>
      <div class="metric"><div class="metric-label">總訂單數</div><div class="metric-value">${to.toLocaleString()}</div><div class="metric-sub">${sd.length} 天資料</div></div>
    </div>
    <div class="sum-card"><div class="sum-title"><i class="ti ti-sparkles"></i> 每日銷售總結</div><div id="sumBody">${buildSummary(sd,bd,tr)}</div></div>
    <div class="card"><div class="sl">總目標達成進度</div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-bottom:4px"><span>$${(tr/10000).toFixed(1)}萬 / $${(TOTAL_TARGET/10000).toFixed(0)}萬</span><span>${pct}%</span></div>
      <div class="prog-wrap"><div class="prog-bar ${parseFloat(pct)>=100?'over':''}" style="width:${Math.min(parseFloat(pct),100)}%"></div></div>
      <div style="font-size:11px;color:var(--t3);margin-top:4px">距目標還需 $${Math.max(0,(TOTAL_TARGET-tr)/10000).toFixed(1)}萬 | 剩餘 ${Math.max(0,dt-dp)} 天</div>
    </div>
    <div class="cost-sec"><div class="sl" style="margin-bottom:2px">💸 專案成本控制</div>
      <p style="font-size:12px;color:var(--t3);margin-bottom:6px">固定成本可直接修改；今日廣告花費填入後點「套用」，自動同步雲端。</p>
      <div id="syncStatus" class="sync"><span class="dot spin"></span><span class="stxt">連線中...</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-top:10px">
        <div>
          <p style="font-size:12px;font-weight:500;color:var(--t2);margin-bottom:4px">固定成本明細</p>
          <table class="fct">
            ${fixedCostItems.map(i=>`<tr><td class="lb">${i.label}</td><td style="text-align:right;padding:3px 6px"><input class="ni fi" type="number" min="0" step="10000" value="${i.value}" onchange="updateFixedCostItem('${i.id}',this)"></td></tr>`).join('')}
            <tr><td class="lb" style="font-weight:500">小計</td><td style="text-align:right;font-weight:500;font-size:12px" id="fct">$${(fc/10000).toFixed(1)}萬</td></tr>
          </table>
          <div class="qa-box">
            <label>今日廣告花費</label>
            <select id="qad">${sd.map(d=>`<option value="${d}" ${d===ld?'selected':''}>${d.slice(5)}</option>`).join('')}</select>
            <input class="ni" id="qai" type="number" min="0" step="1000" placeholder="金額（元）" value="${adCosts[ld]||''}" style="width:110px">
            <button class="btn btn-blue" id="qab" onclick="applyQuickAd()">套用</button>
          </div>
        </div>
        <div>
          <p style="font-size:12px;font-weight:500;color:var(--t2);margin-bottom:4px">成本概覽</p>
          <div class="cmg">
            <div class="metric"><div class="metric-label">固定成本</div><div class="metric-value" id="mFC">$${(fc/10000).toFixed(1)}萬</div><div class="metric-sub">前置+前測+KOL</div></div>
            <div class="metric"><div class="metric-label">廣告成本</div><div class="metric-value" id="mAC">$${(ac/10000).toFixed(1)}萬</div><div class="metric-sub">各日投放加總</div></div>
            <div class="metric"><div class="metric-label">總成本</div><div class="metric-value" id="mTC">$${(tc/10000).toFixed(1)}萬</div><div class="metric-sub">固定 + 廣告</div></div>
            <div class="metric ${gp>=0?'profit':'loss'}"><div class="metric-label">累積毛利</div><div class="metric-value" id="mP">${gp>=0?'+':'-'}$${(Math.abs(gp)/10000).toFixed(1)}萬</div><div class="metric-sub" id="mR">${roi!==null?'ROI '+roi.toFixed(0)+'%':'—'}</div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('trend',this)">每日營收</button>
      <button class="tab" onclick="switchTab('discount',this)">折扣碼</button>
      <button class="tab" onclick="switchTab('hour',this)">購買時段</button>
      <button class="tab" onclick="switchTab('payment',this)">付款方式</button>
      <button class="tab" onclick="switchTab('detail',this)">每日明細 & 廣告成本</button>
    </div>
    <div id="tab-trend" class="tab-panel"><div class="card" style="margin-bottom:0"><div style="position:relative;width:100%;height:${Math.max(220,sd.length*44+80)}px"><canvas id="trendChart"></canvas></div></div></div>
    <div id="tab-discount" class="tab-panel" style="display:none"><div class="card" style="margin-bottom:0">${daySel('discountDay',selDiscountDay,sd)}<div style="position:relative;width:100%;height:${dH}px"><canvas id="discountChart"></canvas></div></div></div>
    <div id="tab-hour" class="tab-panel" style="display:none"><div class="card" style="margin-bottom:0">${daySel('hourDay',selHourDay,sd)}<div style="position:relative;width:100%;height:220px"><canvas id="hourChart"></canvas></div></div></div>
    <div id="tab-payment" class="tab-panel" style="display:none"><div class="card" style="margin-bottom:0"><div style="position:relative;width:100%;height:280px"><canvas id="payChart"></canvas></div></div></div>
    <div id="tab-detail" class="tab-panel" style="display:none"><div class="card" style="margin-bottom:0">
      <p style="font-size:12px;color:var(--t2);margin-bottom:10px">輸入各日廣告金額後自動同步雲端。</p>
      <div class="tw"><table>
        <thead><tr><th>日期</th><th class="n">訂單數</th><th class="n">當日營收</th><th class="n">累計營收</th><th class="n">達成率</th><th class="n">廣告成本（元）</th><th class="n">當日毛利</th></tr></thead>
        <tbody id="detailTbody"></tbody>
      </table></div>
    </div></div>
  `;
  document.getElementById('qad').addEventListener('change',function(){document.getElementById('qai').value=adCosts[this.value]||'';});
  let cr=0;const tbody=document.getElementById('detailTbody');
  sd.forEach(d=>{
    const dd=bd[d];cr+=dd.rev;const dp2=(dd.rev/DAILY_TARGET*100).toFixed(1),av=adCosts[d]||0,dp3=dd.rev-av;
    const t=document.createElement('tr');t.dataset.date=d;t.dataset.rev=dd.rev;
    t.innerHTML=`<td>${d}</td><td class="n">${dd.cnt}</td><td class="n">$${dd.rev.toLocaleString()}</td><td class="n">$${(cr/10000).toFixed(1)}萬</td><td class="n ${parseFloat(dp2)>=100?'ok':'warn'}">${dp2}%</td><td class="ic"><input class="ni ai" type="number" min="0" step="1000" placeholder="0" value="${av||''}" data-date="${d}" onchange="updateAdCost(this)"></td><td class="n ${dp3>=0?'ok':'bad'}">${dp3>=0?'+':'-'}$${(Math.abs(dp3)/10000).toFixed(1)}萬</td>`;
    tbody.appendChild(t);
  });
  setTimeout(()=>{
    const tC=document.getElementById('trendChart');
    if(tC){destroyChart('trend');charts.trend=new Chart(tC,{type:'bar',data:{labels:sd,datasets:[{label:'當日營收',data:sd.map(d=>bd[d].rev),backgroundColor:'#378ADD',borderRadius:3},{label:'每日目標',data:sd.map(()=>DAILY_TARGET),type:'line',borderColor:'#E24B4A',borderDash:[4,4],borderWidth:1.5,pointRadius:0,fill:false,tension:0,datalabels:{display:false}}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},datalabels:{anchor:'end',align:'end',color:'#5f5e5a',font:{size:11},formatter:v=>v===DAILY_TARGET?'':'$'+(v/10000).toFixed(1)+'萬'}},scales:{x:{ticks:{callback:v=>'$'+(v/10000).toFixed(0)+'萬',font:{size:11}},grid:{color:'rgba(128,128,128,0.08)'}},y:{ticks:{font:{size:11},autoSkip:false},grid:{display:false}}},layout:{padding:{right:60}}}});}
    renderDiscountChart();renderHourChart();
    const pC=document.getElementById('payChart');
    if(pC){destroyChart('pay');const pK=Object.keys(byPay).sort((a,b)=>byPay[b]-byPay[a]),tot=pK.reduce((s,k)=>s+byPay[k],0),colors=['#378ADD','#1D9E75','#7F77DD','#D85A30','#D4537E','#888780','#BA7517','#639922'];charts.pay=new Chart(pC,{type:'doughnut',data:{labels:pK,datasets:[{data:pK.map(k=>byPay[k]),backgroundColor:pK.map((_,i)=>colors[i%colors.length]),borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,cutout:'55%',plugins:{legend:{display:true,position:'right',labels:{font:{size:12},padding:10,boxWidth:12}},datalabels:{color:'#fff',font:{size:11,weight:'500'},formatter:v=>{const p=(v/tot*100).toFixed(1);return p>5?p+'%':'';}}}}});}
  },80);
}

function switchTab(name,btn){document.querySelectorAll('.tab-panel').forEach(p=>p.style.display='none');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+name).style.display='block';btn.classList.add('active');}
async function processFile(file){return new Promise(resolve=>{const reader=new FileReader();reader.onload=e=>resolve({name:file.name,orders:parseXlsx(new Uint8Array(e.target.result))});reader.readAsArrayBuffer(file);});}
async function handleFiles(files){
  for(const file of files){
    if(uploadedFiles.includes(file.name))continue;
    const {name,orders}=await processFile(file);mergeOrders(orders);uploadedFiles.push(name);
    const chip=document.createElement('div');chip.className='chip';chip.innerHTML=`<i class="ti ti-file"></i>${name} <button onclick="removeAllFiles()">×</button>`;document.getElementById('fileList').appendChild(chip);
  }
  renderDash();
}
function removeAllFiles(){uploadedFiles=[];allOrders=[];adCosts={};Object.keys(charts).forEach(k=>destroyChart(k));document.getElementById('fileList').innerHTML='';selDiscountDay='all';selHourDay='all';renderDash();}
document.getElementById('fileInput').addEventListener('change',e=>handleFiles(Array.from(e.target.files)));
const zone=document.getElementById('uploadZone');
zone.addEventListener('dragover',e=>{e.preventDefault();zone.style.background='var(--bg2)';});
zone.addEventListener('dragleave',()=>zone.style.background='');
zone.addEventListener('drop',e=>{e.preventDefault();zone.style.background='';handleFiles(Array.from(e.dataTransfer.files));});
loadAllCosts();
</script>
</body>
</html>
