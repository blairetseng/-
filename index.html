async function loadAllCosts(){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/costs?select=key,value`,{headers:sbH});
    const d=await r.json();if(!Array.isArray(d))return;
    d.forEach(row=>{

        adCosts['pretest']=Number(row.value);

        adCosts[row.key.replace('ad_','')]=Number(row.value);

        if(item)item.value=Number(row.value);

async function saveDailySummary(orders){
  const byDate={};
  orders.forEach(o=>{
    if(!byDate[o.date])byDate[o.date]={date:o.date,revenue:0,orders:0,discounts:{},hours:{},payMethods:{}};
    byDate[o.date].revenue+=o.total;
    byDate[o.date].orders++;
    // discounts 改存 {cnt, rev}，rev 為該折扣碼當日實際成交總額
    if(!byDate[o.date].discounts[o.discountKey])byDate[o.date].discounts[o.discountKey]={cnt:0,rev:0};
    byDate[o.date].discounts[o.discountKey].cnt++;
    byDate[o.date].discounts[o.discountKey].rev+=o.total;
    if(o.hour!==undefined){
      const hk=String(o.hour);
      byDate[o.date].hours[hk]=(byDate[o.date].hours[hk]||0)+1;
    }
    if(o.payMethod){
      byDate[o.date].payMethods[o.payMethod]=(byDate[o.date].payMethods[o.payMethod]||0)+1;
    }
  });
  const rows=Object.values(byDate).map(d=>({
    date:d.date,
    revenue:d.revenue,
    orders:d.orders,
    summary_json:JSON.stringify({discounts:d.discounts,hours:d.hours,payMethods:d.payMethods})
  }));
  try{
    await fetch(`${SB_URL}/rest/v1/daily_summary`,{
      method:'POST',
      headers:{...sbH,'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify(rows)
    });
  }catch(e){}
}

async function loadDailySummary(){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/daily_summary?select=date,revenue,orders,summary_json&order=date.asc`,{headers:sbH});
    const d=await r.json();
    if(!Array.isArray(d)||d.length===0)return false;
    // 從彙總資料重建 allOrders 格式
    d.forEach(row=>{
      if(uploadedFiles.includes('summary_'+row.date))return;
      const summary=JSON.parse(row.summary_json||'{}');
      const discounts=summary.discounts||{};
      // 用彙總建立虛擬訂單（for 圖表計算）
      Object.entries(discounts).forEach(([discountKey,cnt])=>{
        for(let i=0;i<cnt;i++){
          allOrders.push({
            id:`summary_${row.date}_${discountKey}_${i}`,
            date:row.date,hour:0,
            total:Math.round(row.revenue/row.orders),
            discountName:'',discountKey,payMethod:''
          });
        }
      });
      uploadedFiles.push('summary_'+row.date);
    });
    return d.length>0;
  }catch(e){return false;}
}

async function loadFullDailySummary(){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/daily_summary?select=date,revenue,orders,summary_json&order=date.asc`,{headers:sbH});
    const d=await r.json();
    if(!Array.isArray(d)||d.length===0)return;
    // 快取精確數字供 getByDate 使用
    window._dailySummaryCache=d;
    // 完整載入，覆蓋虛擬訂單
    allOrders=allOrders.filter(o=>!o.id.startsWith('summary_'));
    uploadedFiles=uploadedFiles.filter(f=>!f.startsWith('summary_'));
    d.forEach(row=>{
      if(uploadedFiles.includes('summary_'+row.date))return;
      const summary=JSON.parse(row.summary_json||'{}');
      const discounts=summary.discounts||{};
      const hours=summary.hours||{};
      const payMethods=summary.payMethods||{};
      const totalOrders=row.orders;
      const avgRev=row.revenue/totalOrders;
      // 重建虛擬訂單，保留折扣碼分佈與精確營收
      // 相容舊格式：discounts[key] 可能是數字(cnt)或物件{cnt,rev}
      Object.entries(discounts).forEach(([discountKey,val])=>{
        const isObj=val&&typeof val==='object';
        const cnt=isObj?val.cnt:val;
        const rev=isObj?val.rev:(cnt*avgRev);
        const perOrder=cnt>0?rev/cnt:0;
        for(let i=0;i<cnt;i++){
          allOrders.push({
            id:`summary_${row.date}_${discountKey}_${i}`,
            date:row.date,hour:null,
            total:perOrder,
            discountName:'',discountKey,payMethod:''
          });
        }
      });
      // 另外建立時段虛擬訂單（用於時段圖表）
      Object.entries(hours).forEach(([h,cnt])=>{
        for(let i=0;i<cnt;i++){
          allOrders.push({
            id:`summary_hour_${row.date}_${h}_${i}`,
            date:row.date,hour:parseInt(h),
            total:0,discountName:'',discountKey:'_hour_only',payMethod:''
          });
        }
      });
      // 另外建立付款方式虛擬訂單（用於付款圖表）
      Object.entries(payMethods).forEach(([pm,cnt])=>{
        for(let i=0;i<cnt;i++){
          allOrders.push({
            id:`summary_pay_${row.date}_${pm}_${i}`,
            date:row.date,hour:0,
            total:0,discountName:'',discountKey:'_pay_only',payMethod:pm
          });
        }
      });
      uploadedFiles.push('summary_'+row.date);
    });
  }catch(e){}
}

// ── KOL/售價時間軸 (Supabase kol_periods) ──
async function loadKolPeriods(){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/kol_periods?select=*`,{headers:sbH});
    const d=await r.json();
    if(Array.isArray(d)&&d.length>0){
      d.sort((a,b)=>{
        if(!a.launch_date&&!b.launch_date)return 0;
        if(!a.launch_date)return 1;
        if(!b.launch_date)return -1;
        return a.launch_date.localeCompare(b.launch_date);
      });
      kolPeriods=d;
    } else {
      // 資料庫是空的：把程式碼內的預設 KOL 清單寫入雲端，之後才有真正的資料可編輯
      for(const p of kolPeriods){
        await saveKolPeriod(p);
      }
    }
  }catch(e){}
}
async function saveKolPeriod(period){
  try{
    // price、min_organic 欄位若為空字串，轉成 null，避免 numeric 型別寫入失敗
    const payload={
      ...period,
      price:(period.price===''||period.price===undefined)?null:Number(period.price),
      min_organic:(period.min_organic===''||period.min_organic===undefined)?null:Number(period.min_organic)
    };
    const r=await fetch(`${SB_URL}/rest/v1/kol_periods`,{
      method:'POST',
      headers:{...sbH,'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify(payload)
    });
    if(!r.ok){
      const errText=await r.text();
      console.error('saveKolPeriod failed:',r.status,errText);
      const statusEl=document.getElementById('kolSaveStatus');
      if(statusEl){statusEl.textContent='⚠ 儲存失敗：'+r.status;statusEl.style.color='#E24B4A';}
      return false;
    }
    const statusEl=document.getElementById('kolSaveStatus');
    if(statusEl){statusEl.textContent='✓ 已同步雲端';statusEl.style.color='#1D9E75';setTimeout(()=>{if(statusEl)statusEl.textContent='';},2000);}
    return true;
  }catch(e){
    console.error('saveKolPeriod error:',e);
    const statusEl=document.getElementById('kolSaveStatus');
    if(statusEl){statusEl.textContent='⚠ 儲存失敗（連線問題）';statusEl.style.color='#E24B4A';}
    return false;
  }
}

  }catch(e){}
}

async function updateKolField(id,field,value){
  const p=kolPeriods.find(x=>x.id===id);
  if(!p)return;
  p[field]=(field==='price'||field==='min_organic')?(value===''?'':parseFloat(value)||0):value;
  await saveKolPeriod(p);
  if(field==='launch_date'){
    kolPeriods.sort((a,b)=>{
      if(!a.launch_date&&!b.launch_date)return 0;
      if(!a.launch_date)return 1;
      if(!b.launch_date)return -1;
      return a.launch_date.localeCompare(b.launch_date);
    });
    renderKolTable();
  }
  renderKolAnalysis();
}
async function addKolPeriod(){
  const newId='p_'+Date.now();
  const p={id:newId,kol_name:'',launch_date:'',price:'',discount_code:''};
  kolPeriods.push(p);
  await saveKolPeriod(p);
  renderKolTable();
  renderKolAnalysis();
}
async function removeKolPeriod(id){
  kolPeriods=kolPeriods.filter(p=>p.id!==id);

  renderKolAnalysis();
}
function renderKolAnalysis(){
  const el=document.getElementById('kolAnalysis');
  if(!el)return;
  const bd=getByDate();
  const sd=Object.keys(bd).sort();
  if(sd.length===0){el.innerHTML='<div style="font-size:12px;color:var(--t3);padding:8px">尚無資料</div>';return;}

  let html='<div class="tw"><table><thead><tr><th>KOL</th><th>上線日</th><th class="n">上線售價</th><th>折扣碼</th><th class="n">自然轉單低標</th><th class="n">累積使用人次</th><th class="n">累積貢獻營收</th></tr></thead><tbody>';

  kolPeriods.forEach(p=>{
    const launch=p.launch_date||'';
    const code=p.discount_code||'';
    const priceStr=p.price?('$'+Number(p.price).toLocaleString()):'—';

    // 直接加總 allOrders 中 discountKey===code 且 date>=launch_date(若有設定) 的實際成交總額
    // 這是「每日上傳報表使用該折扣碼的最終銷售金額」，非估算值
    let totalUses=0, totalRev=0;
    if(code){
      allOrders.forEach(o=>{
        if(o.discountKey!==code)return;
        if(launch&&o.date<launch)return;
        totalUses++;
        totalRev+=o.total;
      });
    }

    const usesStr=code?totalUses.toLocaleString()+' 人':'—';
    const revStr=code&&totalUses>0?'$'+(totalRev/10000).toFixed(1)+'萬':(code?'$0':'—');
    const launchStr=launch||'<span style="color:var(--t3)">未定</span>';
    const codeStr=code||'<span style="color:var(--t3)">未定</span>';

    const minOrgStr=p.min_organic!==''&&p.min_organic!==null&&p.min_organic!==undefined?Number(p.min_organic).toLocaleString()+' 人':'<span style="color:var(--t3)">團購方案</span>';
    html+=`<tr><td><strong>${p.kol_name||'<span style="color:var(--t3)">未命名</span>'}</strong></td><td style="font-size:11px">${launchStr}</td><td class="n">${priceStr}</td><td style="font-size:11px">${codeStr}</td><td class="n">${minOrgStr}</td><td class="n">${usesStr}</td><td class="n">${revStr}</td></tr>`;
  });

  html+='</tbody></table></div>';
  html+='<p style="font-size:11px;color:var(--t3);margin-top:8px">累積使用人次／貢獻營收：直接加總每日上傳報表中該折扣碼訂單的實際成交金額（從上線日起算，折扣碼有效期至 7/26）。</p>';
  el.innerHTML=html;
}

async function loadFolder(folderId){
  const listEl=document.getElementById('gdriveList');
  listEl.innerHTML='<div style="font-size:12px;color:var(--t3);padding:8px">載入中...</div>';
  try{
    const q=folderId==='sharedWithMe'
      ?`sharedWithMe=true and trashed=false`
      :folderId==='root'
      ?`'root' in parents and trashed=false`
      :`'${folderId}' in parents and trashed=false`;
    const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&orderBy=folder,name&fields=files(id,name,mimeType,modifiedTime)&pageSize=50`,{headers:{'Authorization':`Bearer ${gToken}`}});
    const d=await r.json();
    if(!d.files||d.files.length===0){listEl.innerHTML='<div style="font-size:12px;color:var(--t3);padding:8px">此資料夾沒有檔案</div>';return;}
    listEl.innerHTML='';
    let count=0;
    d.files.forEach(f=>{
      const isFolder=f.mimeType==='application/vnd.google-apps.folder';
      const isXlsx=f.mimeType==='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'||f.name.endsWith('.xlsx')||f.name.endsWith('.xls');
      if(!isFolder&&!isXlsx)return;
      const isLoaded=uploadedFiles.includes(f.id)||uploadedFiles.includes('summary_'+extractDate(f.name));
      const date=new Date(f.modifiedTime).toLocaleDateString('zh-TW');
      const div=document.createElement('div');div.className='gdrive-item';
      if(isFolder){
        div.innerHTML=`<span class="gdrive-item-name"><i class="ti ti-folder" style="color:#378ADD"></i>${f.name}</span><span class="gdrive-item-date">${date}</span><span style="font-size:11px;color:var(--t3)">開啟 →</span>`;
        div.style.cursor='pointer';
        div.onclick=()=>{folderStack.push({id:f.id,name:f.name});renderBc();loadFolder(f.id);};
      }else{
        div.innerHTML=`<span class="gdrive-item-name"><i class="ti ti-file-spreadsheet" style="color:#1D9E75"></i>${f.name}</span><span class="gdrive-item-date">${date}</span><button class="gdrive-item-btn ${isLoaded?'loaded':''}" ${isLoaded?'disabled':''} onclick="event.stopPropagation();gdriveLoadFile('${f.id}','${f.name}',this)">${isLoaded?'已載入':'載入'}</button>`;
      }
      listEl.appendChild(div);count++;
    });
    if(count===0)listEl.innerHTML='<div style="font-size:12px;color:var(--t3);padding:8px">此資料夾沒有 Excel 檔案或子資料夾</div>';
  }catch(e){listEl.innerHTML='<div style="font-size:12px;color:#E24B4A;padding:8px">載入失敗，請重新連結</div>';}
}

function extractDate(filename){
  const m=filename.match(/(\d{8})/);
  if(m){const s=m[1];return`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`;}
  return '';
}

// ── 資料處理 ──
function classifyDiscount(r){for(const d of DISCOUNT_MAP)if(d.match(r))return d.key;return'其他';}
function parseXlsx(buffer){
  // 用 raw:true 保留原始值，避免 XLSX.js 自動轉換日期格式造成時間錯誤
  const wb=XLSX.read(buffer,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const headers=rows[0];if(!headers)return[];
  const idx=n=>headers.findIndex(h=>h&&String(h).includes(n));
  const iO=idx('訂單編號'),iS=idx('訂單狀態'),iP=idx('付款方式'),
        iC=idx('訂單建立時間'),iD=idx('折扣名稱'),iT=idx('訂單總額');

  function parseDateTime(val){
    if(!val&&val!==0)return{date:null,hour:0};
    const s=String(val);
    // 格式 1: 2026/06/09 11:01 或 2026-06-09 11:01
    const m1=s.match(/(\d{4})[\/-](\d{2})[\/-](\d{2})\s+(\d{1,2}):(\d{2})/);
    if(m1)return{date:`${m1[1]}-${m1[2]}-${m1[3]}`,hour:parseInt(m1[4])};
    // 格式 2: 只有日期 2026/06/09
    const m2=s.match(/(\d{4})[\/-](\d{2})[\/-](\d{2})/);
    if(m2)return{date:`${m2[1]}-${m2[2]}-${m2[3]}`,hour:0};
    // 格式 3: Excel 序列數值（例如 46182.459...）
    const f=parseFloat(s);
    if(!isNaN(f)&&f>40000){
      // 日期部分
      const dSerial=Math.floor(f);
      const d=new Date(Math.round((dSerial-25569)*86400*1000));
      const date=`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
      // 時間部分：小數點後的比例
      const timeFrac=f-dSerial;
      const hour=Math.floor(timeFrac*24);
      return{date,hour};
    }
    return{date:null,hour:0};
  }

  const orders=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    if(!r[iO]||r[iS]!=='SUCCESS')continue;
    const{date,hour}=parseDateTime(r[iC]);
    if(!date)continue;
    const payRaw=String(r[iP]||'');
    const payMethod=payRaw.split(/\s+/).find(s=>s&&!s.match(/^\d{4}/))||payRaw.split(/\s+/)[0]||'';
    const total=typeof r[iT]==='number'?r[iT]:parseInt(String(r[iT]).replace(/[^0-9]/g,''))||0;
    orders.push({id:String(r[iO]),date,hour,total,discountName:String(r[iD]||''),payMethod:payMethod.trim()});
  }
  orders.forEach(o=>{o.discountKey=classifyDiscount(o);});
  return orders;
}
function mergeOrders(n){const ids=new Set(allOrders.map(o=>o.id));allOrders=allOrders.concat(n.filter(o=>!ids.has(o.id)));}
function destroyChart(k){if(charts[k]){charts[k].destroy();charts[k]=null;}}
function getByDate(){
  // 只用真實訂單和折扣碼虛擬訂單計算營收（排除時段/付款虛擬訂單避免重複計算，排除測試訂單）
  const d={};
  allOrders.forEach(o=>{
    if(o.discountKey==='_hour_only'||o.discountKey==='_pay_only')return;
    if(o.discountKey==='測試訂單')return;
    if(!d[o.date])d[o.date]={rev:0,cnt:0};
    d[o.date].rev+=o.total;
    d[o.date].cnt++;
  });
  // 用 Supabase 的精確數字覆蓋（來自 daily_summary）
  if(window._dailySummaryCache){
    window._dailySummaryCache.forEach(row=>{
      if(d[row.date]){d[row.date].rev=row.revenue;d[row.date].cnt=row.orders;}
    });
  }
  return d;

function getTotalFixedCost(){return fixedCostItems.reduce((s,i)=>s+i.value,0);}
function getPaymentCost(){

}
function getTotalAdCost(){return Object.values(adCosts).reduce((s,v)=>s+v,0);}

function getTotalCost(){return getTotalFixedCost()+getTotalAdCost()+getPaymentCost();}

function buildSummary(sd,bd,tr){

  // 以資料最後一天為基準，而非今天
  const lastDate=new Date(ld+'T00:00:00+08:00');
  const dp=Math.max(1,Math.floor((lastDate-CAMPAIGN_START)/86400000)+1);
  const dl=Math.max(0,Math.floor((CAMPAIGN_END-lastDate)/86400000));
  const ct=Math.min(dp*DAILY_TARGET,TOTAL_TARGET),cp=(tr/ct*100);
  const dn=dl>0?(Math.max(0,TOTAL_TARGET-tr)/dl):0;
  const ds=today.rev>=DAILY_TARGET?`<span class="hi">超標 $${((today.rev-DAILY_TARGET)/10000).toFixed(1)}萬</span>`:`<span class="lo">未達標，缺口 $${((DAILY_TARGET-today.rev)/10000).toFixed(1)}萬</span>`;
  const byD={};allOrders.filter(o=>o.date===ld&&o.discountKey!=='_hour_only'&&o.discountKey!=='_pay_only').forEach(o=>{byD[o.discountKey]=(byD[o.discountKey]||0)+1;});

  const byH=Array(24).fill(0);allOrders.filter(o=>o.date===ld&&o.discountKey!=='_pay_only'&&o.hour!==null&&o.hour!==undefined).forEach(o=>{byH[o.hour]++;});

function getDiscountData(day){

      // 建立 KOL 上線日標記：在對應日期的 y 軸 label 旁顯示星號標記
      const kolByDate={};
      kolPeriods.forEach(p=>{if(p.launch_date)kolByDate[p.launch_date]=(kolByDate[p.launch_date]?kolByDate[p.launch_date]+', ':'')+p.kol_name;});
      charts.trend=new Chart(tC,{type:'bar',data:{labels:sd,datasets:[{label:'當日營收',data:sd.map(d=>bd[d].rev),backgroundColor:sd.map(d=>kolByDate[d]?'#1D9E75':'#378ADD'),borderRadius:3},{label:'每日目標',data:sd.map(()=>DAILY_TARGET),type:'line',borderColor:'#E24B4A',borderDash:[4,4],borderWidth:1.5,pointRadius:0,fill:false,tension:0,datalabels:{display:false}}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},datalabels:{anchor:'end',align:'end',color:'#5f5e5a',font:{size:11},formatter:v=>v===DAILY_TARGET?'':'$'+(v/10000).toFixed(1)+'萬'}},scales:{x:{ticks:{callback:v=>'$'+(v/10000).toFixed(0)+'萬',font:{size:11}},grid:{color:'rgba(128,128,128,0.08)'}},y:{ticks:{font:{size:11},autoSkip:false,callback:function(value,index){const d=sd[index];const label=d?d.slice(5):'';return kolByDate[d]?'★ '+label:label;}},grid:{display:false}}},layout:{padding:{right:60}}}});
    }
    renderDiscountChart();renderHourChart();
    const pC=document.getElementById('payChart');
    if(pC){destroyChart('pay');const pK=Object.keys(byPay).sort((a,b)=>byPay[b]-byPay[a]),tot=pK.reduce((s,k)=>s+byPay[k],0),colors=['#378ADD','#1D9E75','#7F77DD','#D85A30','#D4537E','#888780','#BA7517','#639922'];pC.parentElement.style.height=Math.max(180,pK.length*52+80)+'px';if(pK.length>0)charts.pay=new Chart(pC,{type:'bar',data:{labels:pK,datasets:[{data:pK.map(k=>byPay[k]),backgroundColor:pK.map((_,i)=>colors[i%colors.length]),borderWidth:1}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,layout:{padding:{right:120}},plugins:{legend:{display:false},datalabels:{anchor:'end',align:'end',color:'#333',font:{size:12},formatter:(v)=>`${v} 筆（${(v/tot*100).toFixed(1)}%）`}},scales:{x:{display:false},y:{grid:{display:false}}}}});}
  },80);
  renderKolTable();
  renderKolAnalysis();
}

async function updatePretestAd(input){
  const val=parseInt(input.value)||0;
  adCosts['pretest']=val;
  document.getElementById('pretestAdDisplay').textContent=val>0?'-$'+(val/10000).toFixed(1)+'萬':'—';
  updateAllCostDisplays();
  setSyncStatus('loading');
  await sbSet('ad_pretest',val);
  setSyncStatus('saved','前測廣告已儲存');
}
function switchTab(name,btn){document.querySelectorAll('.tab-panel').forEach(p=>p.style.display='none');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+name).style.display='block';btn.classList.add('active');}

async function processFile(file){return new Promise(resolve=>{const reader=new FileReader();reader.onload=e=>resolve({name:file.name,orders:parseXlsx(new Uint8Array(e.target.result))});reader.readAsArrayBuffer(file);});}

async function handleFiles(files){
  for(const file of files){
    if(uploadedFiles.includes(file.name))continue;
    const {name,orders}=await processFile(file);
    const dates=[...new Set(orders.map(o=>o.date))];
    allOrders=allOrders.filter(o=>!dates.includes(o.date)||!o.id.startsWith('summary_'));
    uploadedFiles=uploadedFiles.filter(f=>!dates.map(d=>'summary_'+d).includes(f));
    mergeOrders(orders);uploadedFiles.push(name);
    await saveDailySummary(orders);
    const chip=document.createElement('div');chip.className='chip';chip.innerHTML=`<i class="ti ti-file"></i>${name} <button onclick="removeNewFiles()">×</button>`;document.getElementById('fileList').appendChild(chip);
  }
  updateDataStatus();renderDash();
}

function removeNewFiles(){
  document.getElementById('fileList').innerHTML='';
  // 只移除手動上傳的，保留雲端歷史
  allOrders=allOrders.filter(o=>o.id.startsWith('summary_'));
  uploadedFiles=uploadedFiles.filter(f=>f.startsWith('summary_'));
  renderDash();
}

document.getElementById('fileInput').addEventListener('change',e=>handleFiles(Array.from(e.target.files)));
const zone=document.getElementById('uploadZone');
zone.addEventListener('dragover',e=>{e.preventDefault();zone.style.background='var(--bg2)';});
zone.addEventListener('dragleave',()=>zone.style.background='');
zone.addEventListener('drop',e=>{e.preventDefault();zone.style.background='';handleFiles(Array.from(e.dataTransfer.files));});

// ── 啟動：從 Supabase 載入所有歷史資料 ──
async function init(){
  document.getElementById('dashContent').innerHTML=`<div class="empty"><i class="ti ti-loader" style="font-size:32px;display:block;margin-bottom:8px;animation:pulse 1s infinite"></i>載入雲端歷史資料中...</div>`;
  await Promise.all([loadAllCosts(), loadFullDailySummary(), loadKolPeriods()]);
  updateDataStatus();
  renderDash();
  setSyncStatus('ok');
  // Set pretest input value after render
  const pi=document.getElementById('pretestAdInput');
  if(pi&&adCosts['pretest'])pi.value=adCosts['pretest'];
  const pd=document.getElementById('pretestAdDisplay');
  if(pd&&adCosts['pretest'])pd.textContent='-$'+(adCosts['pretest']/10000).toFixed(1)+'萬';
}
init();
</script>
